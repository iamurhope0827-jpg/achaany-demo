<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шинэ ачаа · Ачааны төв</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="mock-api.js"></script>
<script src="auth.js"></script>
<script>Auth.requireLogin();</script>
</head>
<body data-page="new-order">
<div class="main">
  <main class="content">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="index.html" aria-label="Нүүр"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      <a href="orders.html">Миний ачаанууд</a>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      <b>Шинэ ачаа</b>
    </nav>
    <section class="page-head">
      <div><h1>Шинэ ачаа бүртгэх</h1><p>Мэдээллээ оруулмагц жолоочид танд үнийн санал илгээнэ.</p></div>
    </section>

    <form class="new-order-grid" id="order-form" novalidate>
      <div class="card form-card">
        <div class="form-alert error" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span></span></div>

        <div>
          <h2>1. Ачааны мэдээлэл</h2>
          <div class="row-2" style="margin-top:14px">
            <div class="field" data-field="title">
              <label for="title">Ачааны нэр</label>
              <div class="input"><input id="title" maxlength="80" placeholder="Жишээ: Бичиг баримт, тавилга" /></div>
              <span class="err"></span>
            </div>
            <div class="field" data-field="weight">
              <label for="weight">Жин (заавал биш)</label>
              <div class="input"><input id="weight" inputmode="decimal" placeholder="0" /><span class="suffix">кг</span></div>
              <span class="err"></span>
            </div>
          </div>
        </div>

        <div>
          <h2>2. Чиглэл</h2>
          <div class="row-2" style="margin-top:14px">
            <div class="field" data-field="from">
              <label for="from">Ачаа авах хаяг</label>
              <div class="input"><input id="from" maxlength="160" placeholder="Дүүрэг, хороо, байр" /></div>
              <span class="err"></span>
            </div>
            <div class="field" data-field="to">
              <label for="to">Хүргэх хаяг</label>
              <div class="input"><input id="to" maxlength="160" placeholder="Дүүрэг, хороо, байр" /></div>
              <span class="err"></span>
            </div>
          </div>
          <div class="field" style="margin-top:16px">
            <label>Авах өдөр</label>
            <div class="chips" id="date-chips">
              <button type="button" class="chip-btn on" data-date="today">Өнөөдөр</button>
              <button type="button" class="chip-btn" data-date="tomorrow">Маргааш</button>
              <button type="button" class="chip-btn" data-date="pick">Өдөр сонгох</button>
              <input type="date" id="date-pick" class="inline-select" hidden />
            </div>
          </div>
        </div>

        <div>
          <h2>3. Шаардлага ба үнэ</h2>
          <div class="field" style="margin-top:14px">
            <label>Тээврийн хэрэгсэл (олныг сонгож болно)</label>
            <div class="chips" id="needs"></div>
          </div>
          <div class="row-2" style="margin-top:16px">
            <div class="field" data-field="price">
              <label for="price">Санал болгох үнэ</label>
              <div class="input"><input id="price" inputmode="numeric" placeholder="10,000" /><span class="suffix">₮</span></div>
              <span class="err"></span>
            </div>
            <div class="field" style="align-content:end">
              <label class="check" style="height:48px;align-items:center"><input type="checkbox" id="urgent" />Яаралтай хүргэлт</label>
            </div>
          </div>
          <div class="field" style="margin-top:16px">
            <label for="note">Жолоочид өгөх тэмдэглэл</label>
            <div class="input"><textarea id="note" maxlength="400" placeholder="Жишээ: Хэврэг ачаа, 2 давхарт хүргэнэ"></textarea></div>
          </div>
        </div>
      </div>

      <aside class="card summary-card">
        <h2 style="font-size:16px;font-weight:800">Захиалгын хураангуй</h2>
        <ul class="kv" style="padding:0" id="summary"></ul>
        <button type="submit" class="btn btn-primary" id="submit" style="height:50px">Захиалга үүсгэх</button>
        <a href="orders.html" class="btn btn-secondary">Болих</a>
        <p class="hint">Захиалга үүсмэгц жолоочид мэдэгдэл очиж, санал илгээж эхэлнэ.</p>
      </aside>
    </form>
  </main>
</div>

<script src="app.js"></script>
<script>
  const { esc, money } = App;
  const $ = id => document.getElementById(id);
  const form = $('order-form');
  const NEEDS = ['Мопед', 'Суудлын автомашин', 'Портер', 'Ачигч', 'Хөргүүртэй'];

  $('needs').innerHTML = NEEDS.map(n => `<button type="button" class="chip-btn" data-need="${esc(n)}" aria-pressed="false">${esc(n)}</button>`).join('');

  // ----- pickup date -----
  let dateMode = 'today';
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return d; };
  $('date-pick').min = ymd(new Date());
  $('date-chips').addEventListener('click', e => {
    const b = e.target.closest('[data-date]');
    if (!b) return;
    dateMode = b.dataset.date;
    $('date-chips').querySelectorAll('[data-date]').forEach(x => x.classList.toggle('on', x === b));
    $('date-pick').hidden = dateMode !== 'pick';
    if (dateMode === 'pick') { $('date-pick').value ||= ymd(tomorrow()); $('date-pick').focus(); }
    summary();
  });
  $('date-pick').addEventListener('change', summary);
  const pickupDate = () => dateMode === 'today' ? ymd(new Date()) : dateMode === 'tomorrow' ? ymd(tomorrow()) : $('date-pick').value;

  $('needs').addEventListener('click', e => {
    const b = e.target.closest('[data-need]');
    if (!b) return;
    b.classList.toggle('on');
    b.setAttribute('aria-pressed', b.classList.contains('on'));
    summary();
  });

  // number formatting
  $('price').addEventListener('input', () => { const n = $('price').value.replace(/\D/g, ''); $('price').value = n ? Number(n).toLocaleString('en-US') : ''; });
  $('weight').addEventListener('input', () => { $('weight').value = $('weight').value.replace(/[^\d.]/g, ''); });

  function data() {
    return {
      type: 'delivery',
      title: $('title').value.trim(),
      weight: $('weight').value.trim(),
      from: $('from').value.trim(),
      to: $('to').value.trim(),
      pickupDate: pickupDate(),
      needs: [...$('needs').querySelectorAll('.on')].map(b => b.dataset.need),
      price: Number($('price').value.replace(/\D/g, '')) || 0,
      urgent: $('urgent').checked,
      note: $('note').value.trim(),
    };
  }

  function summary() {
    const d = data();
    const row = (k, v) => `<li><span>${k}</span><b${v ? '' : ' class="none"'}>${v ? esc(v) : '—'}</b></li>`;
    $('summary').innerHTML = [
      row('Ачаа', d.title),
      row('Авах', d.from),
      row('Хүргэх', d.to),
      row('Авах өдөр', d.pickupDate),
      row('Хэрэгсэл', d.needs.join(', ')),
      row('Яаралтай', d.urgent ? 'Тийм' : ''),
      `<li><span>Үнэ</span><b style="font-size:18px">${d.price ? money(d.price) : '—'}</b></li>`,
    ].join('');
  }
  form.addEventListener('input', e => {
    const f = e.target.closest('[data-field]');
    if (f) App.fieldError(form, f.dataset.field, '');
    App.formAlert(form, '');
    summary();
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const d = data();
    const errs = {};
    if (d.title.length < 2) errs.title = 'Ачааны нэрээ оруулна уу.';
    if (d.from.length < 3) errs.from = 'Ачаа авах хаягаа оруулна уу.';
    if (d.to.length < 3) errs.to = 'Хүргэх хаягаа оруулна уу.';
    if (d.price < 1000) errs.price = 'Үнэ хамгийн багадаа 1,000₮.';
    if (d.weight && isNaN(Number(d.weight))) errs.weight = 'Жинг тоогоор оруулна уу.';
    ['title', 'from', 'to', 'price', 'weight'].forEach(k => App.fieldError(form, k, errs[k]));
    const first = Object.keys(errs)[0];
    if (first) { $(first).focus(); return; }
    if (dateMode === 'pick' && !d.pickupDate) { App.toast('Авах өдрөө сонгоно уу', 'error'); return; }

    $('submit').disabled = true;
    $('submit').textContent = 'Үүсгэж байна…';
    try {
      const r = await App.api('/api/orders', d);
      location.href = `orders.html?open=${encodeURIComponent(r.order.no)}`;
    } catch (err) {
      if (!(err.field && App.fieldError(form, err.field, err.message))) App.formAlert(form, err.message);
      $('submit').disabled = false;
      $('submit').textContent = 'Захиалга үүсгэх';
    }
  });

  summary();
  $('title').focus();
</script>
</body>
</html>
