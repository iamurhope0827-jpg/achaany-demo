<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Урамшуулал · Ачааны төв</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="mock-api.js"></script>
<script src="auth.js"></script>
<script>Auth.requireLogin();</script>
</head>
<body data-page="promotions">
<div class="main">
  <main class="content">
    <section class="page-head">
      <div><h1>Урамшуулал</h1><p>Купоны кодоо оруулж хэтэвчиндээ бонус нэмээрэй</p></div>
      <div class="page-actions"><a href="wallet.html" class="btn btn-secondary"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Хэтэвч: <span id="wallet">0₮</span></a></div>
    </section>

    <section class="card card-pad">
      <div class="card-head"><div><h2>Купоны код оруулах</h2><p>Код том, жижиг үсэг ялгахгүй</p></div></div>
      <form class="redeem" id="redeem-form" novalidate>
        <div class="field" data-field="code">
          <div class="input">
            <svg viewBox="0 0 24 24"><path d="M3 9h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/></svg>
            <input id="code" maxlength="20" placeholder="Жишээ: ACHAA10" autocapitalize="characters" spellcheck="false" />
          </div>
          <span class="err"></span>
        </div>
        <button type="submit" class="btn btn-primary" style="height:48px" id="redeem-btn">Идэвхжүүлэх</button>
      </form>
    </section>

    <section>
      <div class="card-head" style="margin-bottom:14px"><div><h2>Танд боломжтой купонууд</h2></div></div>
      <div class="coupon-grid" id="coupons"></div>
    </section>

    <section class="card card-pad" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <h2 style="font-size:17px;font-weight:800">Гишүүнчлэлийн багцаар илүү хэмнээрэй</h2>
        <p class="hint" style="font-size:13px;margin-top:4px">Бизнес болон Корпорат багцад тээврийн шимтгэлийн хөнгөлөлт, тэргүүлэх дэмжлэг багтана.</p>
      </div>
      <a href="profile.html#plans" class="btn btn-primary">Багц харах</a>
    </section>
  </main>
</div>

<script src="app.js"></script>
<script>
  const { esc, money } = App;
  const $ = id => document.getElementById(id);
  const form = $('redeem-form');

  async function loadCoupons() {
    try {
      const d = await App.api('/api/coupons');
      $('coupons').innerHTML = d.coupons.map(c => `
        <article class="card coupon${c.used ? ' used' : ''}">
          <div class="amt">+${Math.round(c.amount / 1000)}K<br>₮</div>
          <div>
            <h3>${esc(c.title)}</h3>
            <p class="hint">Хэтэвчинд ${money(c.amount)} нэмнэ</p>
            <code>${esc(c.code)}</code><br>
            ${c.used ? '<span class="chip done" style="margin-top:12px">Ашигласан</span>' : `<button class="btn btn-secondary" data-code="${esc(c.code)}">Ашиглах</button>`}
          </div>
        </article>`).join('');
    } catch (e) { App.toast(e.message, 'error'); }
  }

  async function redeem(code) {
    App.fieldError(form, 'code', '');
    if (!code) { App.fieldError(form, 'code', 'Купоны кодоо оруулна уу.'); $('code').focus(); return; }
    $('redeem-btn').disabled = true;
    try {
      const d = await App.api('/api/coupon', { code });
      Auth.setUser(d.user);
      $('wallet').textContent = money(d.user.wallet);
      $('code').value = '';
      App.toast(`Купон идэвхжлээ: +${money(d.transaction.amount)}`);
      App.loadNotifications();
      loadCoupons();
    } catch (e) {
      App.fieldError(form, 'code', e.message);
    } finally { $('redeem-btn').disabled = false; }
  }

  form.addEventListener('submit', e => { e.preventDefault(); redeem($('code').value.trim()); });
  $('code').addEventListener('input', () => App.fieldError(form, 'code', ''));
  $('coupons').addEventListener('click', e => { const b = e.target.closest('[data-code]'); if (b) redeem(b.dataset.code); });

  Auth.ready.then(u => { if (!u) return; $('wallet').textContent = money(u.wallet); loadCoupons(); });
</script>
</body>
</html>
